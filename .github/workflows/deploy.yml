name: Build and deploy documentation

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: documentation-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-deploy:
    name: Build and deploy
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build documentation
        run: pnpm docs:build

      - name: Deploy to Cloudflare Workers
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          command: deploy

  validate-golden-path:
    name: Validate golden-path example
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate the example
        run: pnpm example:golden-path:check

  validate-sdk:
    name: Validate SDK and CLI documentation against source
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ANVIA_REPO: ${{ github.workspace }}/anvia-source

    steps:
      - name: Check out documentation
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check out the reviewed Anvia revision
        uses: actions/checkout@v6
        with:
          repository: anvia-hq/anvia
          ref: 7cbbe395d881f68133a5644c357e9f1ce2c23f3f
          path: anvia-source
          persist-credentials: false

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.0.4
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install SDK validation dependencies
        working-directory: anvia-source
        run: pnpm install --frozen-lockfile

      - name: Build Core for SDK workspace imports
        working-directory: anvia-source
        run: pnpm --filter @anvia/core build

      - name: Check SDK exports, snippets, and offline runtime examples
        run: pnpm sdk:check

      - name: Check CLI exports and snippet API shapes
        run: pnpm cli:check
